name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu (core)
            os: ubuntu-latest
            qnn: false
          # Windows x64 with the QNN plugin: runs the tests that attach QNN EP,
          # compile for the HTP and exercise the compiled-graph cache.
          - name: windows + onnxruntime-qnn
            os: windows-latest
            qnn: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # onnxruntime is pinned to the version the plugin-attachment behaviour was
      # verified on; tests/test_runtime.py documents that behaviour as a canary.
      # The annotate plugin turns each test failure into a check annotation, so
      # failures are readable from the public API without opening the log.
      - name: Install test dependencies
        run: pip install onnxruntime==1.26.0 numpy onnx fastapi httpx python-multipart soundfile librosa rich pytest pytest-github-actions-annotate-failures

      - name: Install QNN plugin (x64 HTP compiler, compile-only)
        if: matrix.qnn
        run: pip install "onnxruntime-qnn>=2.6"

      - name: Report QNN EP devices on this runner
        if: matrix.qnn
        run: python -c "import platform, onnxruntime as o, onnxruntime_qnn as q; o.register_execution_provider_library('QNNExecutionProvider', q.get_library_path()); print('::notice title=QNN EP devices::' + platform.processor() + ' | ' + repr([(d.ep_name, str(d.device.type), d.device.vendor) for d in o.get_ep_devices()]))"

      - name: Run tests
        run: python -m pytest -rs
